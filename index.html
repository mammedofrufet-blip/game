<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="play.css">
    <title>Document</title>
</head>

<body>
    <header class="all">

    </header>
    <main>
        <section class="playing">
            <div class="start">
                <button class="fl-btn">Start</button>
                <span class="game-fl-timer">
                    00:32
                </span>
            </div>
            <div class="game-area">

            </div>
        </section>
    </main>
    <main class="all-2">
        <div>
            <button class="up">
                Up
            </button>
            <button class="down">
                Down
            </button>
            <span class="total-points">0</span>
        </div>
        <section class="cubs">


            <div class="ball"><span class="regem">Rufet</span></div>
        </section>
    </main>


    <main>
        <section class="sec">
            <div class="off">
                <img src="off.jpeg" alt="">
            </div>
            <div class="on display-off">
                <img src="on.jpeg" alt="">
            </div>
            <div class="lamp">
                <button class="on-off">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M8.19 15.08c.26.36.62 1.38.81 2.05v2.86c0 1.1.9 2 2 2h2c1.1 0 2-.9 2-2v-2.86c.2-.68.56-1.7.82-2.06.35-.5.72-.93 1.08-1.36 1.03-1.21 2.1-2.46 2.1-4.72 0-3.86-3.14-7-7-7s-7 3.14-7 7c0 2.29 1.07 3.53 2.1 4.73.36.42.73.85 1.09 1.35ZM11 20v-2h2.02L13 20zm1-16c2.76 0 5 2.24 5 5 0 1.53-.64 2.28-1.62 3.42-.37.43-.79.93-1.2 1.51-.37.53-.7 1.42-.92 2.07h-2.52c-.21-.65-.55-1.55-.93-2.08-.41-.57-.83-1.06-1.2-1.49C7.64 11.3 6.99 10.55 6.99 9c0-2.76 2.24-5 5-5Z">
                        </path>
                        <path d="M12 7V5C9.79 5 8 6.79 8 9h2c0-1.1.9-2 2-2"></path>
                    </svg>
                </button>
            </div>
        </section>
    </main>

    <main>
        <section>
            <div>
                <img src="gunes.jpeg" alt="" class="src">
            </div>
            <span>Temperature</span>
            <div class="temp"><button class="temp-plus"> + </button> <button class="temp-minus"> - </button></div>
            
            
        </section>
    </main>

    <script src="play.js"></script>
</body>

</html>
